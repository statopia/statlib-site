name: statlib-site

services:
  statlib-site:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SOURCE_COMMIT: ${STATLIB_SITE_SOURCE_COMMIT:-unknown}
    image: statlib-site:${STATLIB_SITE_IMAGE_TAG:-latest}
    container_name: statlib-site
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    ports:
      - "127.0.0.1:8090:80"
    networks:
      - proxy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true
    name: proxy_default
